# UROC MAVLink Bridge Configuration
#
# This configuration file sets parameters for the MAVLink to ROS2 message bridge.
# The bridge enables communication with external MAVLink systems and converts
# MAVLink messages to ROS2 messages for integration with the visualization system.
#
# These parameters configure the MAVLink connection details and system identification
# for proper message routing and communication with drone autopilot systems.

/**/*:
  ros__parameters:
    # MAVLink connection string - defines how to connect to the MAVLink system
    # Format: "protocol:address:port"
    # Common examples:
    #   - "udp:localhost:14445" - UDP connection to local simulator
    #   - "tcp:192.168.1.100:5760" - TCP connection to remote system
    #   - "serial:/dev/ttyUSB0:57600" - Serial connection to hardware
    mavlink_connection: "udp:localhost:14445"
    
    # System ID for MAVLink communication - identifies this system in the MAVLink network
    # Should match the system ID expected by the connected autopilot/ground station
    system_id: 1
    
    # Component ID for MAVLink communication - identifies this component within the system
    # Standard component IDs: 1=autopilot, 154=gimbal, 190=onboard computer
    component_id: 1