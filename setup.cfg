# UROC Data Visualizer Package Setup Configuration
#
# This file configures the Python package installation paths for
# the ROS2 ament build system. It ensures that executable scripts
# are installed in the correct ROS2 package location structure.

[develop]
# Development installation: scripts go to package lib directory
script_dir=$base/lib/umd_uroc_data_visualizer

[install]
# Production installation: scripts go to package lib directory
install_scripts=$base/lib/umd_uroc_data_visualizer
